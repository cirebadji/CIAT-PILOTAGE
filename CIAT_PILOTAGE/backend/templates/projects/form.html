{% extends "base.html" %}{% block page_title %}{{ titre }}{% endblock %}{% block content %}<div class="welcome-row"><div><h1>{{ titre }}</h1><p>Renseignez les informations du projet.</p></div><a href="{% url 'project_list' %}" class="btn btn-light">Retour</a></div><div class="panel form-panel"><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}</div><div class="mt-4"><button class="btn btn-primary">Enregistrer</button></div></form></div>{% endblock %}
