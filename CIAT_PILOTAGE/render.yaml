databases:
  - name: ciat-pilotage-db
    databaseName: ciat_pilotage
    user: ciat_pilotage
    plan: free

services:
  - type: web
    name: ciat-pilotage-demo
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ciat-pilotage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CIAT_ADMIN_USERNAME
        value: jury
      - key: CIAT_ADMIN_EMAIL
        value: jury@example.test
      - key: CIAT_ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
